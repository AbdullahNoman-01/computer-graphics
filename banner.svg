<svg width="100%" height="auto" viewBox="0 0 900 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.08" />
      <circle cx="30" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: 2px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 4px;
      fill: #94a3b8;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #cbd5e1;
      letter-spacing: 1px;
    }
  </style>

  <!-- Background Base -->
  <rect width="900" height="260" rx="16" fill="url(#bg-grad)" />
  <rect width="900" height="260" rx="16" fill="url(#grid)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Abstract Graphic Art on Left / Right -->
  <!-- Left Side: Coordinate Axes & Raster Line / Clipping Box -->
  <g opacity="0.85" transform="translate(45, 45)">
    <!-- Clipping Window -->
    <rect x="25" y="25" width="90" height="90" fill="#0284c7" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="32" y="42" font-family="monospace" font-size="9" fill="#38bdf8" opacity="0.8">WINDOW</text>

    <!-- Axes -->
    <line x1="10" y1="130" x2="140" y2="130" stroke="#64748b" stroke-width="1.5" />
    <line x1="15" y1="10" x2="15" y2="135" stroke="#64748b" stroke-width="1.5" />
    <!-- Arrow heads -->
    <polygon points="140,127 146,130 140,133" fill="#64748b" />
    <polygon points="12,10 15,4 18,10" fill="#64748b" />

    <!-- Clipped Line (Inside: Green, Outside: Red dashed) -->
    <line x1="0" y1="135" x2="40" y2="95" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />
    <line x1="40" y1="95" x2="100" y2="35" stroke="#10b981" stroke-width="3" filter="url(#soft-glow)" />
    <line x1="100" y1="35" x2="135" y2="0" stroke="#ef4444" stroke-width="2" stroke-dasharray="3 3" opacity="0.6" />

    <!-- Points -->
    <circle cx="40" cy="95" r="3.5" fill="#10b981" />
    <circle cx="100" cy="35" r="3.5" fill="#10b981" />
  </g>

  <!-- Right Side: Circle Drawing & Symmetry / 2D Transform -->
  <g opacity="0.85" transform="translate(710, 45)">
    <!-- Bresenham Circle / Midpoint Symmetry -->
    <circle cx="75" cy="75" r="55" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.3" />
    <!-- Circle Pixels simulation -->
    <g fill="#ec4899" filter="url(#soft-glow)">
      <rect x="70" y="18" width="10" height="10" rx="2" />
      <rect x="70" y="122" width="10" height="10" rx="2" />
      <rect x="18" y="70" width="10" height="10" rx="2" />
      <rect x="122" y="70" width="10" height="10" rx="2" />
      <rect x="36" y="36" width="10" height="10" rx="2" fill="#a855f7" />
      <rect x="104" y="36" width="10" height="10" rx="2" fill="#a855f7" />
      <rect x="36" y="104" width="10" height="10" rx="2" fill="#a855f7" />
      <rect x="104" y="104" width="10" height="10" rx="2" fill="#a855f7" />
    </g>
    <!-- Symmetry lines -->
    <line x1="75" y1="10" x2="75" y2="140" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
    <line x1="10" y1="75" x2="140" y2="75" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
    <line x1="25" y1="25" x2="125" y2="125" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.25" />
    <line x1="25" y1="125" x2="125" y2="25" stroke="#a855f7" stroke-width="1" stroke-dasharray="3 3" opacity="0.25" />
  </g>

  <!-- Glowing Center Ambient Light -->
  <circle cx="450" cy="110" r="140" fill="#38bdf8" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Center Content -->
  <!-- Badge: ACADEMIC LAB PREP -->
  <g transform="translate(365, 42)">
    <rect x="0" y="0" width="170" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="14" cy="12" r="4" fill="#10b981" filter="url(#soft-glow)" />
    <text x="26" y="16" class="badge-text" fill="#38bdf8">LAB FINAL PREP</text>
  </g>

  <!-- Title -->
  <text x="450" y="112" text-anchor="middle" class="title" filter="url(#glow)">COMPUTER GRAPHICS</text>

  <!-- Subtitle -->
  <text x="450" y="146" text-anchor="middle" class="subtitle">Algorithms • 2D Transformations • Visualizations</text>

  <!-- Technology Badges Row -->
  <g transform="translate(230, 185)">
    <!-- Badge 1: Python -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="95" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="47" y="18" text-anchor="middle" class="badge-text">🐍 Python</text>
    </g>
    <!-- Badge 2: Matplotlib -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="55" y="18" text-anchor="middle" class="badge-text">📊 Matplotlib</text>
    </g>
    <!-- Badge 3: DDA & Bresenham -->
    <g transform="translate(235, 0)">
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="57" y="18" text-anchor="middle" class="badge-text">📏 Line &amp; Circle</text>
    </g>
    <!-- Badge 4: Clipping -->
    <g transform="translate(365, 0)">
      <rect x="0" y="0" width="85" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="42" y="18" text-anchor="middle" class="badge-text">✂️ Clipping</text>
    </g>
  </g>
</svg>
